<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>Chatten</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main class="chat-shell">

        <header class="chat-header">

            <nav id="rooms" class="rooms" aria-label="Chatrum">
                <button
                    class="room-button active"
                    data-room-id="lobby"
                    type="button"
                >
                    #lobbyn<span class="room-count">(0)</span>
                </button>

                <button
                    class="room-button"
                    data-room-id="baren"
                    type="button"
                >
                    #baren<span class="room-count">(0)</span>
                </button>

                <button
                    class="room-button"
                    data-room-id="loungen"
                    type="button"
                >
                    #loungen<span class="room-count">(0)</span>
                </button>

                <button
                    class="room-button"
                    data-room-id="balkongen"
                    type="button"
                >
                    #balkongen<span class="room-count">(0)</span>
                </button>
            </nav>

            <button
                id="sound-toggle"
                class="sound-toggle"
                type="button"
                aria-label="Ljud på"
                title="Ljud på"
            >
                <img
                    id="sound-icon"
                    src="/static/images/notification-sound.svg"
                    alt=""
                >
            </button>

            <button
                id="menu-toggle"
                class="menu-toggle"
                type="button"
                aria-label="Öppna meny"
                aria-expanded="false"
            >
                <span aria-hidden="true">☰</span>
            </button>

        </header>

        <div id="menu-overlay" class="menu-overlay" hidden></div>

        <aside
            id="menu-drawer"
            class="menu-drawer"
            aria-label="Meny"
            aria-hidden="true"
        >
            <div class="menu-header">
                <span>MENY</span>

                <button
                    id="menu-close"
                    class="menu-close"
                    type="button"
                    aria-label="Stäng meny"
                >
                    ×
                </button>
            </div>

            <nav class="menu-nav" aria-label="Huvudmeny">

                <button
                    id="menu-profile"
                    class="menu-item"
                    type="button"
                    data-menu-action="profile"
                >
                    Profil
                </button>

                <button
                    id="menu-logout"
                    class="menu-item hidden"
                    type="button"
                    data-menu-action="logout"
                >
                    Logga ut
                </button>

                <button
                    class="menu-item"
                    type="button"
                    data-menu-action="settings"
                >
                    Inställningar
                </button>

                <button
                    class="menu-item"
                    type="button"
                    data-menu-action="help"
                >
                    Hjälp
                </button>

                <button
                    class="menu-item"
                    type="button"
                    data-menu-action="privacy"
                >
                    Integritet
                </button>

                <button
                    class="menu-item"
                    type="button"
                    data-menu-action="terms"
                >
                    Villkor
                </button>

            </nav>
        </aside>

        <div id="auth-panel" class="auth-panel hidden">
            <div class="auth-box">

                <button
                    id="auth-close"
                    class="auth-close"
                    type="button"
                    aria-label="Stäng"
                >
                    ×
                </button>

                <div class="auth-tabs">
                    <button
                        id="auth-login-tab"
                        class="auth-tab active"
                        type="button"
                    >
                        Logga in
                    </button>

                    <button
                        id="auth-register-tab"
                        class="auth-tab"
                        type="button"
                    >
                        Registrera
                    </button>
                </div>

                <div id="login-form" class="auth-form">

                    <h2>Logga in</h2>

                    <label for="login-name">Login-ID</label>
                    <input
                        id="login-name"
                        type="text"
                        maxlength="20"
                        autocomplete="username"
                        spellcheck="false"
                    >

                    <label for="login-password">Lösenord</label>
                    <input
                        id="login-password"
                        type="password"
                        maxlength="128"
                        autocomplete="current-password"
                    >

                    <div id="login-error" class="auth-error"></div>

                    <button
                        id="login-submit"
                        type="button"
                    >
                        Logga in
                    </button>

                </div>

                <div id="register-form" class="auth-form hidden">

                    <h2>Registrera konto</h2>

                    <label for="register-login-name">Login-ID</label>
                    <input
                        id="register-login-name"
                        type="text"
                        minlength="4"
                        maxlength="20"
                        autocomplete="username"
                        spellcheck="false"
                    >

                    <div
                        id="register-login-status"
                        class="auth-status"
                    ></div>

                    <label for="register-alias">Alias</label>
                    <input
                        id="register-alias"
                        type="text"
                        minlength="2"
                        maxlength="20"
                        autocomplete="nickname"
                    >

                    <div
                        id="register-alias-status"
                        class="auth-status"
                    ></div>

                    <label for="register-password">Lösenord</label>
                    <div class="password-field">
                        <input
                            id="register-password"
                            type="password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="register-password"
                        >
                            Visa
                        </button>
                    </div>
                    <div class="auth-hint">8–128 tecken. Alla vanliga tecken är tillåtna.</div>
                    <div id="register-password-status" class="auth-status"></div>

                    <label for="register-password-confirm">Bekräfta lösenord</label>
                    <div class="password-field">
                        <input
                            id="register-password-confirm"
                            type="password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="register-password-confirm"
                        >
                            Visa
                        </button>
                    </div>
                    <div id="register-password-confirm-status" class="auth-status"></div>

                    <div
                        id="register-error"
                        class="auth-error"
                    ></div>

                    <button
                        id="register-submit"
                        type="button"
                    >
                        Registrera
                    </button>

                </div>

            </div>
        </div>

        <div id="register-confirm-panel" class="auth-panel hidden">
            <div class="auth-box auth-confirm-box">

                <h2>Registrera konto?</h2>

                <p>
                    Det finns ingen funktion för att återställa lösenord eller konto.
                    Om du glömmer ditt lösenord kan kontot inte återställas automatiskt.
                </p>

                <p>
                    Är du säker på att du vill skapa kontot?
                </p>

                <div class="auth-confirm-actions">
                    <button
                        id="register-confirm-cancel"
                        type="button"
                    >
                        Avbryt
                    </button>

                    <button
                        id="register-confirm-submit"
                        type="button"
                    >
                        Registrera
                    </button>
                </div>

            </div>
        </div>

        <div class="chat-content">
            <section id="messages" class="messages"></section>

            <button
                id="userlist-toggle"
                class="userlist-toggle"
                type="button"
                aria-label="Dölj användarlista"
                aria-expanded="true"
            >
                −
            </button>

            <aside id="online-users" class="online-users">
                <div class="online-header">
                    <span>ANVÄNDARE</span>
                </div>

                <div
                    id="online-user-list"
                    class="online-user-list"
                ></div>
            </aside>
        </div>

        <form id="message-form" class="message-form">
            <div class="message-input-wrap">
                <textarea
                    id="message-input"
                    placeholder="Skriv ett meddelande"
                    autocomplete="off"
                    maxlength="4000"
                    rows="1"
                ></textarea>

                <span id="message-counter" class="message-counter">
                    0/4000
                </span>
            </div>

            <button type="submit" aria-label="Skicka">
                <img src="/static/images/send-msg.svg" alt="">
            </button>
        </form>

    </main>

    <script src="/static/chat.js"></script>
</body>
</html>
